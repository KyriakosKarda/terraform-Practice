!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f8fafc;
      background:
        radial-gradient(circle at 20% 20%, rgba(99, 102, 241, .35), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(236, 72, 153, .24), transparent 32%),
        #090d18;
      overflow: hidden;
    }

    .card {
      width: min(720px, 100%);
      padding: 56px 34px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 30px;
      background: rgba(255, 255, 255, .06);
      backdrop-filter: blur(18px);
      box-shadow: 0 30px 80px rgba(0, 0, 0, .35);
    }

    .code {
      margin: 0;
      font-size: clamp(6rem, 22vw, 11rem);
      line-height: .85;
      letter-spacing: -.08em;
      font-weight: 900;
      background: linear-gradient(135deg, #a5b4fc, #f9a8d4);
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: 0 0 55px rgba(129, 140, 248, .16);
    }

    h1 {
      margin: 28px 0 12px;
      font-size: clamp(1.7rem, 5vw, 2.7rem);
    }

    p {
      margin: 0 auto;
      max-width: 500px;
      color: #aeb8ca;
      line-height: 1.7;
      font-size: 1.05rem;
    }

    .actions {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    a, button {
      min-height: 48px;
      padding: 0 20px;
      border-radius: 14px;
      border: 0;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform .2s ease, opacity .2s ease;
    }

    a:hover, button:hover {
      transform: translateY(-2px);
    }

    .home {
      color: #111827;
      background: #f8fafc;
    }

    .back {
      color: #f8fafc;
      background: rgba(255, 255, 255, .1);
      border: 1px solid rgba(255, 255, 255, .12);
    }

    .orb {
      position: fixed;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .25;
      z-index: -1;
    }

    .orb.one {
      top: -70px;
      right: -70px;
      background: #6366f1;
    }

    .orb.two {
      bottom: -90px;
      left: -90px;
      background: #ec4899;
    }
  </style>
</head>

<body>
  <div class="orb one"></div>
  <div class="orb two"></div>

  <main class="card">
    <p class="code">404</p>
    <h1>Opps! Page Not found</h1>

    <div class="actions">
      <!-- Άλλαξε το href="/" με το link της αρχικής σου σελίδας -->
      <a class="home" href="/">homepage</a>
      <button class="back" onclick="history.back()">Back</button>
    </div>
  </main>
</body>
</html>
